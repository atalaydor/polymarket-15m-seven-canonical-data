name: Polymarket 15m x 7 isolated compute and serialized publish

on:
  workflow_call:
    inputs:
      assets:
        required: true
        type: string
      day:
        required: true
        type: string
      release_group:
        required: true
        type: string

permissions: {}

jobs:
  compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - name: Compute isolated authenticated canonical bytes
        env:
          ASSETS: ${{ inputs.assets }}
          DAY: ${{ inputs.day }}
          RELEASE_GROUP: ${{ inputs.release_group }}
        run: >-
          python -m scripts.actions_backend compute-day
          --day "$DAY"
          --expected-release-group "$RELEASE_GROUP"
          --expected-assets "$ASSETS"
          --bundle-root "$RUNNER_TEMP/staged-bundle"
      - id: upload
        name: Store immutable noncanonical staging bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staged-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.day }}
          path: ${{ runner.temp }}/staged-bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: compute
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
    concurrency:
      group: polymarket-15m-seven-release-${{ inputs.release_group }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - name: Retrieve immutable staging bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staged-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.day }}
          path: ${{ runner.temp }}/staged-bundle
      - name: Authenticate and publish under the short release writer
        env:
          DAY: ${{ inputs.day }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_GROUP: ${{ inputs.release_group }}
        run: >-
          python -m scripts.actions_backend publish-staged-day
          --day "$DAY"
          --expected-release-group "$RELEASE_GROUP"
          --bundle-root "$RUNNER_TEMP/staged-bundle"
      - name: Delete transient staging artifact after durable publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method DELETE
          "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ needs.compute.outputs.artifact-id }}"
